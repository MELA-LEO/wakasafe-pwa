<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAKASAFE - Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Helvetica Neue', sans-serif;
        background: linear-gradient(to br, #020617 0%, #0f172a 50%, #020617 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        max-width: 400px;
        text-align: center;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(100, 116, 139, 0.2);
        border-radius: 16px;
        padding: 40px 24px;
        space: 20px;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 12px;
        background: linear-gradient(to right, #22c55e, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p {
        color: #94a3b8;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        padding: 8px 16px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        color: #fca5a5;
        font-size: 14px;
        margin-bottom: 24px;
      }

      button {
        width: 100%;
        padding: 12px 24px;
        background: linear-gradient(to right, #22c55e, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      button:hover {
        transform: scale(1.02);
      }

      button:active {
        transform: scale(0.98);
      }

      .info {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(100, 116, 139, 0.2);
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⚠️</div>
      <h1>You're Offline</h1>
      <p>We couldn't reach the WAKASAFE server. Check your internet connection and try again.</p>
      <div class="status">No Internet Connection</div>
      <button onclick="location.reload()">Try Again</button>
      <div class="info">
        <p>You can still view previously loaded content, but some features won't be available.</p>
      </div>
    </div>
  </body>
</html>
